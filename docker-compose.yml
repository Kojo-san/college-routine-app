services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: college
      POSTGRES_PASSWORD: college
      POSTGRES_DB: college_routine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U college -d college_routine"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
